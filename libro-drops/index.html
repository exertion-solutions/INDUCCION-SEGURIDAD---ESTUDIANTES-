<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro DROPS (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEA; --surface:#FFFFFF; --sunk:#F3F5F4; --ink:#1C262B; --muted:#5B686E; --line:#CBD2CF;
  --red:#BF2F1B; --red-soft:#F6DDD8; --amber:#D99A00; --amber-soft:#FBEFCB; --green:#2E7A4A; --green-soft:#D9EEDF;
  --steel:#34454D; --none:#8A969B; --none-soft:#E3E7E6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171A; --surface:#1A2226; --sunk:#151C1F; --ink:#E4E9E7; --muted:#98A5AA; --line:#2B363B;
  --red:#E5533C; --red-soft:#3A201B; --amber:#F2B705; --amber-soft:#382E12; --green:#4DAE70; --green-soft:#17301F;
  --steel:#9FB3BC; --none:#7E8B90; --none-soft:#232C30; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#1A2226; --sunk:#151C1F; --ink:#E4E9E7; --muted:#98A5AA; --line:#2B363B;
  --red:#E5533C; --red-soft:#3A201B; --amber:#F2B705; --amber-soft:#382E12; --green:#4DAE70; --green-soft:#17301F;
  --steel:#9FB3BC; --none:#7E8B90; --none-soft:#232C30; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0}
h1{font-size:1.9rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem;font-weight:600}
p{margin:.3rem 0}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:10px;height:22px;background:repeating-linear-gradient(135deg,var(--red) 0 4px,transparent 4px 7px);border:2px solid var(--red)}
.eq-select{margin-left:auto;max-width:55%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-weight:600}
.banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:6px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--steel);font-weight:600;text-decoration:underline;text-underline-offset:3px}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:10px;min-height:44px}
textarea.t{min-height:80px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--none-soft);color:var(--ink);white-space:nowrap}
.chip.alto{background:var(--red-soft);color:var(--red)}
.chip.medio{background:var(--amber-soft);color:var(--ink)}
.chip.bajo{background:var(--green-soft);color:var(--green)}
.chip.bien{background:var(--green-soft);color:var(--green)}
.chip.mal{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft)}

/* Mástil */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.summary b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1}
.summary span{font-size:.8rem;color:var(--muted)}
.summary .due b{color:var(--red)}
.summary i.cnt{font-style:normal}
.mast{position:relative;margin-top:6px}
.mz{display:grid;grid-template-columns:62px 1fr;align-items:stretch;min-height:64px}
.mz .truss{position:relative;display:flex;justify-content:center}
.mz .truss span{display:block;height:100%;border-left:3px solid var(--steel);border-right:3px solid var(--steel);
  background:repeating-linear-gradient(40deg,transparent 0 9px,var(--steel) 9px 11px,transparent 11px 20px),
             repeating-linear-gradient(-40deg,transparent 0 9px,var(--steel) 9px 11px,transparent 11px 20px);opacity:.75}
.mz .truss .crown{position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:12px;background:var(--steel);border-radius:2px}
.mz .truss .floor{position:absolute;top:0;left:4px;right:4px;height:8px;background:var(--steel)}
.mz .truss .deck,.mz .truss .pad{background:none}
.mz .truss .deck{height:100%;width:52px;border-left:3px solid var(--steel);border-right:3px solid var(--steel);opacity:.55}
.mz .truss .pad{width:44px;height:100%;border:2px dashed var(--line);border-radius:4px}
.zb{display:flex;align-items:center;gap:10px;text-align:left;width:100%;margin:4px 0;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--none);border-radius:6px;padding:9px 12px;min-height:56px}
.zb.alto{border-left-color:var(--red)} .zb.medio{border-left-color:var(--amber)} .zb.bajo{border-left-color:var(--green)}
.zb .zn{font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.15}
.zb .zm{font-size:.8rem;color:var(--muted)}
.zb .zc{margin-left:auto;text-align:right;flex:none}
.obsn{display:inline-block;min-width:26px;padding:1px 7px;border-radius:99px;background:var(--red);color:#fff;font-weight:700;font-size:.85rem;text-align:center}
.ground{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font-size:.8rem;color:var(--muted)}
.ground::before,.ground::after{content:"";flex:1;height:0;border-top:3px double var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* Items */
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.item .code{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.9rem}
.item h3{margin:2px 0 6px}
.fx{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.9rem;margin:8px 0}
.fx dt{color:var(--muted);font-weight:600}
.fx dd{margin:0}
.fx .miss{color:var(--red);font-style:italic}
.crit{font-size:.88rem;background:var(--sunk);border-radius:6px;padding:8px 10px;margin-top:6px}
.refimg{width:100%;max-height:220px;object-fit:cover;border-radius:6px;margin:8px 0;border:1px solid var(--line)}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

details{margin-top:10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
details summary{cursor:pointer;padding:10px 12px;font-weight:600;min-height:44px;display:flex;align-items:center}
details .detb{padding:0 12px 10px}
details h4{font-family:var(--display);font-size:1rem;margin:10px 0 4px}
details ul{margin:4px 0;padding-left:20px;font-size:.9rem}
details li{margin:3px 0}
main a{color:var(--steel);font-weight:600}
.regbox{border-top:1px dashed var(--line);margin-top:12px;padding-top:4px}
.btn[aria-pressed="true"]{border-color:var(--steel);background:var(--sunk)}
/* Inspección */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.seg button{min-height:48px;border:2px solid var(--line);background:var(--sunk);border-radius:6px;font-weight:700;font-family:var(--display);font-size:1.05rem}
.seg button[aria-pressed="true"].b{background:var(--green);border-color:var(--green);color:#fff}
.seg button[aria-pressed="true"].m{background:var(--red);border-color:var(--red);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--steel)}
.zhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:var(--bg);padding:10px 0 6px;display:flex;align-items:center;gap:8px}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--steel);border-radius:8px;padding:14px;margin-bottom:10px}
.choice h3{margin-bottom:2px}

/* Hallazgos */
.filters{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;min-height:38px}
.filters button[aria-pressed="true"]{background:var(--steel);color:var(--surface);border-color:var(--steel)}
.hz{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.hz.cerrado{opacity:.7}

/* Calculadora */
.calcout{border-radius:8px;padding:14px;margin-top:12px;border:2px solid var(--line)}
.calcout b{font-family:var(--display);font-size:1.6rem;display:block}
.chartbox{overflow-x:auto;margin-top:12px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--red)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;margin-left:2px}

/* Hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,18,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90%;font-weight:600}
.loader{padding:80px 20px;text-align:center;color:var(--muted)}
/* Estado de zona durante la inspección */
.mz{--tc:var(--steel)}
.mz.st-ok{--tc:var(--green)} .mz.st-mal{--tc:var(--red)} .mz.st-pend{--tc:var(--none)}
.mz .truss span{border-color:var(--tc)!important}
.mz.st-ok .truss span,.mz.st-mal .truss span{background:repeating-linear-gradient(40deg,transparent 0 9px,var(--tc) 9px 11px,transparent 11px 20px),repeating-linear-gradient(-40deg,transparent 0 9px,var(--tc) 9px 11px,transparent 11px 20px)}
.mz.st-ok .truss .pad,.mz.st-mal .truss .pad{background:none;border-color:var(--tc)}
.zb .zp{display:block;height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px;max-width:220px}
.zb .zp i{display:block;height:100%;background:var(--tc)}
.zb.alto.stz-mal,.zb.medio.stz-mal,.zb.bajo.stz-mal,.zb.stz-mal{border-left-color:var(--red)}
.zb.stz-ok{border-left-color:var(--green)}
.zb.stz-pend{border-left-color:var(--none)}
.btn3d{display:inline-flex;align-items:center;gap:6px}
.btn3d svg{width:18px;height:18px}
.venc{font-weight:700;color:var(--red)} .vok{color:var(--muted)}
.falta{color:var(--red);font-weight:600}
/* Todos los equipos */
table.tq{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.9rem}
table.tq th,table.tq td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.tq th{font-family:var(--display);font-weight:600;background:var(--sunk)}
table.tq td.n{text-align:right;font-family:var(--display);font-size:1.1rem;font-weight:700}
table.tq td.n.r{color:var(--red)}
.tqwrap{overflow-x:auto}
/* Firma */
.firma{width:100%;height:140px;background:var(--sunk);border:1px dashed var(--line);border-radius:6px;touch-action:none;display:block}
/* Calculadora */
.calcgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media (min-width:560px){.calcgrid{grid-template-columns:minmax(0,1fr) 150px}}
.fall{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;height:230px;overflow:hidden}
.fall .sc{position:absolute;left:8px;top:14px;bottom:30px;border-left:2px solid var(--line)}
.fall .sc b{position:absolute;left:4px;font-size:.7rem;font-weight:600;color:var(--muted);white-space:nowrap;transform:translateY(-50%)}
.fall .gr{position:absolute;left:0;right:0;bottom:0;height:30px;background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 8px);border-top:2px solid var(--steel)}
.fall .ob{position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;background:var(--steel);border-radius:3px}
.fall .fl{position:absolute;left:50%;bottom:30px;width:80px;height:80px;margin:0 0 -40px -40px;border-radius:50%;opacity:0}
.fall .ln{position:absolute;right:8px;bottom:36px;font-size:.78rem;font-weight:600;text-align:right}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;margin-top:8px}
.clegend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
/* Visor 3D */
#v3d{position:fixed;inset:0;z-index:40;background:#0E1417;display:none;flex-direction:column;color:#E4E9E7}
#v3d.on{display:flex}
#v3d .vh{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid #2B363B}
#v3d .vh h2{font-size:1.2rem;color:#E4E9E7}
#v3d .vh button{margin-left:auto;background:#1A2226;color:#E4E9E7;border:1px solid #2B363B;border-radius:6px;min-height:44px;padding:8px 14px;font-weight:600}
#v3d .cv{position:relative;flex:1;min-height:0}
#v3d canvas{display:block;width:100%;height:100%}
#v3d .rot{position:absolute;left:10px;top:10px;background:rgba(217,154,0,.92);color:#1C262B;font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:4px;pointer-events:none}
#v3d .tip{position:absolute;pointer-events:none;background:#1C262B;border:1px solid #98A5AA;color:#fff;font-size:.8rem;padding:4px 8px;border-radius:5px;transform:translate(-50%,-130%);white-space:nowrap;display:none}
#v3d .vl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #2B363B}
#v3d .vl i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#v3d .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#98A5AA}
/* Cierre */
.stamp{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,15,18,.45);pointer-events:none}
.stamp div{background:var(--surface);border:3px solid var(--green);color:var(--green);border-radius:12px;padding:18px 26px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.5rem;transform:rotate(-4deg)}
.stamp svg{width:56px;height:56px;display:block;margin:0 auto 6px}
.stamp small{display:block;font-size:.95rem;color:var(--ink)}
/* Movimiento */
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}
  .anim .mz{animation:zin .38s ease-out both}
  @keyframes zin{from{opacity:0;transform:translateX(-14px)}}
  .mz.st-mal .truss span{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .fall.go .ob{animation:caer var(--t) cubic-bezier(.55,0,1,.45) forwards}
  @keyframes caer{to{top:178px}}
  .fall.go .fl{animation:flash .5s ease-out var(--t) forwards}
  @keyframes flash{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
  .stamp div{animation:sello .55s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes sello{from{opacity:0;transform:rotate(-4deg) scale(1.6)}}
  .stamp path{stroke-dasharray:40;stroke-dashoffset:40;animation:chk .35s .3s ease-out forwards}
  @keyframes chk{to{stroke-dashoffset:0}}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
}
@media (prefers-reduced-motion:reduce){.fall .ob{top:178px!important}}
@media (min-width:640px){.summary b{font-size:2rem}}
</style>
</head>

<script>
"use strict";
/* ============ PLANTILLA RCCO (POWSG020-A3 / Libro DROPS Tacker Rev.03) ============ */
const CT="Verificar visualmente que los elementos estén correctamente colocados: tuerca autofrenante o tuerca común con chaveta partida.";
const ESL=" Verificar la condición de las eslingas de seguridad.";
const NL=" Verificar que estén colocadas las arandelas Nord-Lock.";
const BOL=" Verificar bolsillo contenedor de la roldana ante corte de eje (PO-WSG-020, 6.3.4).";
const GC="Verificar condición de grilletes y de cables de seguridad.";
const TIN="Verificar estado de soldadura del tintero y colocación de perno y seguro.";
const NR="No requerida";
// [descripción, fijación primaria, retención secundaria, aseguramiento de seguridad, criterio, riesgo]
const PLANTILLA=[
 {cod:"COR",nombre:"Corona",riesgo:"alto",pos:"alto",items:[
  ["Polea de pistón","3 topes guía cable con bulones y tuercas autofrenantes o tuercas con chaveta partida","",NR,CT,"alto"],
  ["Polea viajera","3 topes guía cable con bulones y tuercas autofrenantes o tuercas con chaveta partida","",NR,CT,"alto"],
  ["Polea de punto muerto","3 topes guía cable con bulones y tuercas autofrenantes o tuercas con chaveta partida","",NR,CT,"alto"],

const COLS=["equipos","libros","inspecciones","hallazgos"];

const LKEY="libroDrops.v1";
const timers={},inflight={},queued={};
function localSave(){if(S.mode!=="local")return;try{localStorage.setItem(LKEY,JSON.stringify(S.data))}catch(e){toast("No hay más espacio en este navegador. Borrá fotos o usá la versión publicada.")}}
function localLoad(){try{const r=localStorage.getItem(LKEY);if(r){const d=JSON.parse(r);COLS.forEach(c=>S.data[c]=d[c]||{})}}catch(e){}}
function put(col,obj,delay){
  S.data[col][obj.id]=obj;
  syncToServer(col,obj);
  if(S.mode==="local"){localSave();return}
  const path=col+"/"+obj.id;
  clearTimeout(timers[path]);
  if(delay){timers[path]=setTimeout(()=>{delete timers[path];dbWrite(path)},delay)}else dbWrite(path);
}
const syncT={};
function syncToServer(col,obj){
  if(!SYNC_URL||col==="libros")return;
  clearTimeout(syncT[obj.id]);
  syncT[obj.id]=setTimeout(()=>{const datos=clone(obj);
    ["foto","firma"].forEach(k=>{if(datos[k]&&datos[k].data)delete datos[k]});
    fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({coleccion:col,clave:col+"|"+obj.id,equipoId:obj.equipoId||obj.id,actualizado:new Date().toISOString(),datos})}).catch(()=>{})},1500);
}
async function dbWrite(path){
  const [col,id]=path.split("/");const obj=S.data[col][id];if(!obj)return;
  if(inflight[path]){queued[path]=true;return}
  inflight[path]=true;
  try{await S.db.doc(path).set(clone(obj))}
  catch(e){dbError(e)}
  inflight[path]=false;
  if(queued[path]){delete queued[path];dbWrite(path)}
}
async function del(col,id){
  delete S.data[col][id];
  if(S.mode==="local"){localSave();return}
  try{await S.db.doc(col+"/"+id).delete()}catch(e){dbError(e)}
}
function dbError(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){if(!S.readOnly){S.readOnly=true;toast("Tu acceso es de solo lectura: los cambios no se guardan.");render()}}
  else if(c==="quota_exceeded")toast("El libro llegó a su límite de registros. Borrá inspecciones viejas para seguir.");
  else if(c==="revoked"){S.readOnly=true;render()}
  else toast("No se pudo guardar. Revisá la conexión y volvé a intentar.");
}
async function initStore(){
  const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
  const db=use?await use("db").catch(()=>null):null;
  if(db){
    S.db=db;S.mode="db";
    let pending=COLS.length;
    COLS.forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        const next={};
        snap.docs.forEach(d=>{const path=col+"/"+d.id;
          if(timers[path]||inflight[path])next[d.id]=S.data[col][d.id]||d.data();else next[d.id]=clone(d.data())});
        Object.keys(S.data[col]).forEach(id=>{const p=col+"/"+id;if((timers[p]||inflight[p])&&!next[id])next[id]=S.data[col][id]});
        S.data[col]=next;
        if(pending>0){pending--;if(pending===0)boot();else return}
        render();
      },err=>{dbError(err)});
    });
    use("assets").then(a=>{S.assets=a;render()}).catch(()=>{});
  }else{
    S.mode="local";localLoad();boot();
  }
  if(use)use("downloads").then(d=>{S.downloads=d;render()}).catch(()=>{});
}

/* ============ Calculadora (aprox. del gráfico PO-WSG-020 6.4.5) ============ */
const CAL={m:[1,2,3,4,5,6,8,10],pa:[5.0,2.4,1.7,1.3,1.0,0.9,0.7,0.5],tr:[6.8,3.4,2.3,1.8,1.4,1.2,0.9,0.8],tp:[11,5.8,4.0,3.0,2.6,2.2,1.8,1.5]};
function limite(arr,m){const x=CAL.m;if(m<=x[0])return arr[0];for(let i=1;i<x.length;i++)if(m<=x[i]){const t=(m-x[i-1])/(x[i]-x[i-1]);return arr[i-1]+t*(arr[i]-arr[i-1])}return arr[arr.length-1]}
function consecuencia(m,h){
  m=parseFloat(String(m).replace(",","."));h=parseFloat(String(h).replace(",","."));
  if(!(m>0)||!(h>0))return null;
  const e=m*9.8*h,fuera=m<1||m>10;
  let c="fat";
  if(h<=limite(CAL.pa,m))c="pa";else if(h<=limite(CAL.tr,m))c="tr";else if(h<=limite(CAL.tp,m))c="tp";
  return{e,c,fuera};
}

function vCalc(){
  const {m,h}=UI.calc;const r=consecuencia(m,h);
  const W=360,H=236,px=v=>34+(v-1)/9*(W-46),py=v=>H-28-v/15*(H-50);
  const curve=arr=>CAL.m.map((x,k)=>`${px(x)},${py(arr[k])}`).join(" ");
  const area=(top,bot,col)=>`<polygon fill="${col}" points="${CAL.m.map((x,k)=>`${px(x)},${py(top?top[k]:15)}`).join(" ")} ${CAL.m.slice().reverse().map((x,k)=>`${px(x)},${py(bot?bot[CAL.m.length-1-k]:0)}`).join(" ")}"/>`;
  const mm=parseFloat(String(m).replace(",",".")),hh=parseFloat(String(h).replace(",","."));
  const col=r?(r.c==="pa"?"var(--green)":r.c==="fat"?"var(--red)":r.c==="tp"?"#E07A2E":"var(--amber)"):"var(--line)";
  const v=r?Math.sqrt(2*9.8*hh):0,t=r?Math.sqrt(2*hh/9.8):0;
  const pin=r&&!r.fuera&&hh<=15;const cx=pin?px(mm):0,cy=pin?py(hh):0;const prev=UI.calcPrev||{cx,cy};UI.calcNext={cx,cy};
  const hmax=Math.max(5,Math.ceil((hh||0)/5)*5);
  return `<h1>Calculadora de consecuencia</h1>
  <p class="small muted">Masa del objeto contra altura de caída, como en el gráfico del PO-WSG-020 (6.4.5).</p>
  <div class="panel" style="margin-top:12px"><div class="row" style="gap:10px">
    <div style="flex:1"><label class="f" for="cM">Masa (kg)</label><input class="t" id="cM" inputmode="decimal" data-calc="m" value="${esc(m)}"></div>
    <div style="flex:1"><label class="f" for="cH">Altura (m)</label><input class="t" id="cH" inputmode="decimal" data-calc="h" value="${esc(h)}"></div></div>
    ${r?`<div class="calcout" style="border-color:${col}"><span class="small muted">Consecuencia potencial</span><b>${CONS[r.c].t}</b><span class="small">Energía de impacto: ${r.e.toLocaleString("es-AR",{maximumFractionDigits:1})} J · Velocidad al impacto: ${v.toLocaleString("es-AR",{maximumFractionDigits:1})} m/s (${(v*3.6).toLocaleString("es-AR",{maximumFractionDigits:0})} km/h) · Tiempo de caída: ${t.toLocaleString("es-AR",{maximumFractionDigits:2})} s</span>
      ${r.fuera?`<p class="small" style="color:var(--red)">La masa está fuera del rango del gráfico del procedimiento (1 a 10 kg). Usá la calculadora DROPS oficial (POWSG020-A4).</p>`:""}</div>`:`<p class="small muted" style="margin-top:10px">Ingresá masa y altura mayores a cero.</p>`}
  </div>
  <div class="calcgrid">
  <div class="chartbox" style="margin-top:0"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de consecuencias por masa y altura">
    ${area(null,CAL.tp,"var(--red)")}${area(CAL.tp,CAL.tr,"#E07A2E")}${area(CAL.tr,CAL.pa,"var(--amber)")}${area(CAL.pa,null,"var(--green)")}
    <polyline fill="none" stroke="var(--surface)" stroke-width="1" points="${curve(CAL.pa)}"/><polyline fill="none" stroke="var(--surface)" stroke-width="1" points="${curve(CAL.tr)}"/><polyline fill="none" stroke="var(--surface)" stroke-width="1" points="${curve(CAL.tp)}"/>
    ${[1,2,4,6,8,10].map(x=>`<text x="${px(x)}" y="${H-12}" font-size="10" text-anchor="middle" fill="var(--muted)">${x}</text>`).join("")}
    ${[0,5,10,15].map(y=>`<text x="26" y="${py(y)+3}" font-size="10" text-anchor="end" fill="var(--muted)">${y}</text>`).join("")}
    <text x="${(px(1)+px(10))/2}" y="${H-1}" font-size="10" text-anchor="middle" fill="var(--muted)">Masa (kg)</text><text x="4" y="11" font-size="10" fill="var(--muted)">Altura (m)</text>
    ${pin?`<circle id="cPt" cx="${cx}" cy="${cy}" r="6" fill="var(--ink)" stroke="var(--surface)" stroke-width="2">${prev.cx&&(prev.cx!==cx||prev.cy!==cy)?`<animate attributeName="cx" from="${prev.cx}" to="${cx}" dur=".35s" begin="indefinite" fill="freeze"/><animate attributeName="cy" from="${prev.cy}" to="${cy}" dur=".35s" begin="indefinite" fill="freeze"/>`:""}</circle>`:""}
  </svg>
  <div class="clegend"><span><i style="background:var(--green)"></i>Primeros auxilios</span><span><i style="background:var(--amber)"></i>Tarea restringida</span><span><i style="background:#E07A2E"></i>Tiempo perdido</span><span><i style="background:var(--red)"></i>Fatalidad</span></div></div>
  ${r?`<div class="fall" id="fallBox" style="--t:${Math.min(t,2.5).toFixed(2)}s" aria-label="Animación de la caída">
    <div class="sc">${[hmax,hmax/2,0].map(y=>`<b style="top:${100-y/hmax*100}%">${y} m</b>`).join("")}</div>
    <div class="ob" style="top:${(178-186*Math.min(hh,hmax)/hmax).toFixed(1)}px"></div><div class="fl" style="background:${col}"></div><div class="gr"></div>
    <div class="ln">${(v*3.6).toLocaleString("es-AR",{maximumFractionDigits:0})} km/h</div>
    <button class="link small" data-act="recaer" style="position:absolute;right:8px;top:8px">Repetir</button></div>`:""}
  </div>
  <p class="small muted" style="margin-top:10px">Curvas aproximadas a partir del gráfico del procedimiento, como orientación. Para registrar un incidente, confirmá con la planilla oficial POWSG020-A4. El cálculo supone un objeto romo y personal con EPP; la animación usa el tiempo de caída libre real (sin rozamiento), limitado a 2,5 s.</p>`;
}

const PDF_LIBS=["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"];

}

function montarFirma(cv){
  const i=UI.insp&&S.data.inspecciones[UI.insp];if(!i)return;
  const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.lineJoin="round";g.strokeStyle=getComputedStyle(document.body).color;
  if(i.firma){const im=new Image();im.onload=()=>g.drawImage(im,0,0,r.width,r.height);im.src=i.firma}
  if(S.readOnly)return;
  let last=null,trazo=false;
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);UI.firmando=true;last=pos(e);trazo=false;e.preventDefault()};
  cv.onpointermove=e=>{if(!last)return;const p=pos(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;trazo=true};

  }
  Object.values(V3.zonas).forEach(z=>z.material.emissive.setHex(0));
  if(o.userData.zona)o.material.emissive.setHex(0x333333);
  V3.sel=o;tip3D(o);
}
function loop3D(){
  V3.loop=true;
  const f=now=>{if(!V3.open){V3.loop=false;return}
    if(V3.tw)V3.tw(now);V3.ctl.update();
    const s=reduce()?1:1+0.25*Math.sin(now/260);
    V3.marcas.children.forEach(m=>{const k=m===V3.sel?1.6:m.userData.st==="mal"?s:1;m.scale.setScalar(k)});
    V3.rnd.render(V3.sc,V3.cam);
    if(V3.tipObj){const tp=document.getElementById("v3tip");const p=(V3.tipObj.userData.pid?V3.tipObj.position.clone():zonaCentro(V3.tipObj.userData.zona).c).project(V3.cam);
      const b=V3.rnd.domElement;tp.style.left=((p.x+1)/2*b.clientWidth)+"px";tp.style.top=((1-p.y)/2*b.clientHeight)+"px";tp.style.display=p.z<1?"block":"none"}
    requestAnimationFrame(f)};
  requestAnimationFrame(f);
}

/* ============ Eventos ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){return}
  if(t.dataset.act==="closeSheet"&&e.target.closest("[data-stop]")&&!e.target.closest("button[data-act=closeSheet]"))return;
  const a=t.dataset.act,v=t.dataset.v,eq=eqAct();
  let insp=UI.insp?S.data.inspecciones[UI.insp]:(UI.tab==="equipo"&&UI.zona&&eq?inspFicha(eq,false):null);
  if(["res","fotoRes","obsTog"].includes(a)&&t.dataset.z&&!(t.dataset.it||"").startsWith("ck")){insp=insp&&insp.tipo!=="checklist"?inspFicha(eq,false,t.dataset.z)||insp:inspFicha(eq,true,t.dataset.z);if(!insp){render();return}}
  switch(a){
    case"irEq":UI.todos=false;setEquipo(v);UI.tab="equipo";UI.zona=null;UI.animZonas=true;break;
    case"tab":UI.todos=false;UI.tab=v;UI.zona=null;if(v==="equipo")UI.animZonas=true;if(v!=="inspeccion")UI.insp=null;window.scrollTo(0,0);break;
    case"zona":UI.zona=v;window.scrollTo(0,0);break;
    case"back":UI.zona=null;UI.animZonas=true;break;
    case"sheet":UI.sheet=v;draft=null;break;
    case"closeSheet":UI.sheet=null;draft=null;break;
    case"crearEquipo":{const n=($("#nEq").value||"").trim();if(!n){toast("Escribí el nombre del equipo.");return}
      if(equipos().some(x=>x.nombre.toLowerCase()===n.toLowerCase())){toast("Ya existe un equipo con ese nombre.");return}
      crearEquipo(n,$("#nPl").checked);UI.sheet=null;UI.tab="equipo";UI.zona=null;break}
    case"renombrar":{const n=($("#rnEq").value||"").trim();if(!n)return;eq.nombre=n;put("equipos",eq);UI.sheet=null;toast("Nombre guardado.");break}
    case"borrarEquipo":if(!confirm(`¿Borrar ${eq.nombre} con su libro, inspecciones y hallazgos? No se puede deshacer.`))return;
      insps(eq).forEach(i=>del("inspecciones",i.id));hallz(eq).forEach(h=>del("hallazgos",h.id));del("libros",eq.id);del("equipos",eq.id);UI.sheet=null;UI.equipo=null;break;
    case"editItem":{const lb=libro(eq);if(v==="__nuevo"){const z=lb.zonas.find(x=>x.id===UI.zona)||lb.zonas[0];draft={__nuevo:true,zonaId:z.id,comp:"",desc:"",primaria:"",secundaria:"",seguridad:"",criterio:"",riesgo:z.riesgo||"",masa:"",altura:"",foto:null}}
      else{for(const z of lb.zonas){const it=z.items.find(x=>x.id===v);if(it){draft={...clone(it),zonaId:z.id};break}}}
      UI.sheet="item:"+v;break}
    case"guardarItem":{if(!draft.desc.trim()){toast("La descripción no puede quedar vacía.");return}
      const lb=clone(libro(eq));const z=lb.zonas.find(x=>x.id===draft.zonaId);const {__nuevo,zonaId,...it}=draft;
      if(__nuevo){it.id=uid();it.art=z.items.reduce((m,x)=>Math.max(m,x.art),0)+1;it.pid=z.cod+"-"+it.art;it.propio=true;z.items.push(it)}else{const k=z.items.findIndex(x=>x.id===it.id);z.items[k]=it}
      guardarLibro(lb);UI.sheet=null;draft=null;toast("Ficha guardada.");break}
    case"borrarItem":{if(!confirm("¿Borrar este componente del libro?"))return;const lb=clone(libro(eq));const z=lb.zonas.find(x=>x.id===draft.zonaId);z.items=z.items.filter(x=>x.id!==draft.id);guardarLibro(lb);UI.sheet=null;draft=null;break}
    case"fotoItem":pedirFoto(f=>{draft.foto=f;render()});return;
    case"quitarFotoItem":draft.foto=null;break;
    case"nueva":if(insps(eq).some(i=>i.estado==="abierta")){toast("Terminá o borrá la inspección abierta antes de empezar otra.");return}nuevaInspeccion(v);window.scrollTo(0,0);break;
    case"nuevaPost":if(insps(eq).some(i=>i.estado==="abierta")){toast("Terminá o borrá la inspección abierta antes de empezar otra.");return}{const m=$("#pMot").value;UI.sheet=null;nuevaInspeccion("post",m);window.scrollTo(0,0)}break;
    case"continuar":UI.insp=v;UI.tab="inspeccion";UI.zona=null;window.scrollTo(0,0);break;
    case"salirInsp":UI.insp=null;break;
    case"res":{const r=insp.resultados[t.dataset.it]||(insp.resultados[t.dataset.it]={});r.estado=r.estado===v?"":v;put("inspecciones",insp,600);break}
    case"ck":{const c=insp.checklist[+t.dataset.k];c.r=c.r===v?"":v;put("inspecciones",insp,600);break}
    case"fotoRes":{const id=t.dataset.it,iid=insp.id;pedirFoto(f=>{const i=S.data.inspecciones[iid];(i.resultados[id]||(i.resultados[id]={})).foto=f;put("inspecciones",i);render()});return}
    case"cerrarInsp":if(t.disabled)return;cerrarInspeccion(insp);window.scrollTo(0,0);sello("Inspección cerrada");break;
    case"borrarFirma":if(insp){delete insp.firma;delete insp.firmaFecha;put("inspecciones",insp)}break;
    case"v3d":abrir3D(t.dataset.z||null,t.dataset.p||null);return;
    case"recaer":caer();return;
    case"borrarInsp":if(!confirm("¿Borrar esta inspección del historial? Los hallazgos que generó se mantienen."))return;del("inspecciones",v);break;
    case"pdf":exportarPDF(v);return;
    case"obsTog":{const k=t.dataset.it;UI.obsOpen.has(k)?UI.obsOpen.delete(k):UI.obsOpen.add(k);render();const el=document.getElementById(k.startsWith("ck")?k:"o_"+k);if(el&&UI.obsOpen.has(k))el.focus();return}
    case"quitarFotoRes":{const r=insp.resultados[t.dataset.it];if(r){delete r.foto;put("inspecciones",insp)}break}
    case"fotoCk":{const k=+t.dataset.k,iid=insp.id;pedirFoto(f=>{const i=S.data.inspecciones[iid];i.checklist[k].foto=f;put("inspecciones",i);render()});return}
    case"quitarFotoCk":{delete insp.checklist[+t.dataset.k].foto;put("inspecciones",insp);break}
    case"csv":csvHallazgos();return;
    case"hf":UI.hfilter=v;break;
    case"fotoCierre":pedirFoto(f=>{draft=draft||{};draft.foto=f;render()});return;
    case"cerrarH":{const h=S.data.hallazgos[v];const com=($("#hCom").value||"").trim();if(!com){toast("Contá qué se hizo para cerrar el hallazgo.");return}
      if(!(draft&&draft.foto)){toast("Agregá la foto de evidencia de la corrección.");return}
      if(!(h.responsable||"").trim()){toast("Asigná un responsable antes de cerrar.");return}
      h.estado="cerrado";h.cierre={fecha:new Date().toISOString(),comentario:com,foto:draft.foto,por:UI.inspector||""};put("hallazgos",h);UI.sheet=null;draft=null;toast("Hallazgo cerrado.");break}
    case"reabrir":{const h=S.data.hallazgos[v];h.estado="abierto";delete h.cierre;put("hallazgos",h);break}
  }
  if(["tab","zona","back","irEq","continuar","salirInsp"].includes(a))withVT(render);else render();
});
document.addEventListener("input",e=>{
  const el=e.target,ds=el.dataset;const insp=UI.insp?S.data.inspecciones[UI.insp]:(UI.tab==="equipo"&&UI.zona&&eqAct()?inspFicha(eqAct(),false):null);
  if(ds.bind&&insp){insp[ds.bind]=el.value;if(ds.bind==="inspector"){UI.inspector=el.value;try{localStorage.setItem("libroDrops.inspector",el.value)}catch(x){}}put("inspecciones",insp,900)}
  else if(ds.obs&&insp){const r=insp.resultados[ds.obs]||(insp.resultados[ds.obs]={});const was=!!(r.obs||"").trim();r.obs=el.value;put("inspecciones",insp,900);if(was!==!!el.value.trim())render()}
  else if(ds.resp&&insp){(insp.resultados[ds.resp]||(insp.resultados[ds.resp]={})).responsable=el.value;put("inspecciones",insp,900)}
  else if(ds.ckobs&&insp){insp.checklist[+ds.ckobs].obs=el.value;put("inspecciones",insp,900)}
  else if(ds.draft&&draft){draft[ds.draft]=el.value;if(ds.draft==="masa"||ds.draft==="altura")render()}
  else if(ds.calc){UI.calc[ds.calc]=el.value;render()}
  else if(el.id==="hCom"){draft=draft||{};draft.com=el.value}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="eqSel"){if(el.value==="__nuevo"){UI.sheet="nuevoEquipo";el.value=UI.todos?"__todos":UI.equipo}else if(el.value==="__todos"){UI.todos=true;UI.zona=null;UI.insp=null}else{UI.todos=false;setEquipo(el.value);UI.zona=null;UI.insp=null;UI.animZonas=true}withVT(render)}
  else if(el.dataset.hb){const h=S.data.hallazgos[el.dataset.h];h[el.dataset.hb]=el.value.trim();put("hallazgos",h);render()}
  else if(el.dataset.draft==="riesgo"||el.dataset.draft==="zonaId"||el.dataset.draft==="comp"){draft[el.dataset.draft]=el.value}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.det){d.open?UI.open.add(d.dataset.det):UI.open.delete(d.dataset.det)}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&V3.open){cerrar3D();return}if(e.key==="Escape"&&UI.sheet){UI.sheet=null;draft=null;render()}});

initStore();
</script>
